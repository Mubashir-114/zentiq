[tool.pyrefly]
search-path = ["backend"]

[tool.pyrefly.errors]
missing-attribute = "ignore"
bad-assignment = "ignore"
untyped-import = "ignore"
bad-override-mutable-attribute = "ignore"
bad-override = "ignore"

[tool.pyright]
extraPaths = ["backend"]
typeCheckingMode = "off"
reportAttributeAccessIssue = "none"
